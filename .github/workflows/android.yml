name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew --no-daemon test lintDebug assembleDebug
